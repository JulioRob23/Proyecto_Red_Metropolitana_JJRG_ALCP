services:

  postgres:
    image: postgres:16.15-alpine3.23
    container_name: redmetro-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - redmetro_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  kafka:
    image: apache/kafka:3.9.2
    container_name: redmetro-kafka

    ports:
      - "9092:9092"

    restart: unless-stopped


volumes:
  redmetro_pgdata: