red_metropolitana:

  target: dev

  outputs:

    dev:
      type: postgres

      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5433') | int }}"

      user: "{{ env_var('POSTGRES_USER', 'red_user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"

      dbname: "{{ env_var('POSTGRES_DB', 'red_metropolitana') }}"

      schema: silver

      threads: 4